[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-preview-video-builder"
version = "0.1.0"
description = "Build and validate MP4 files with a hidden physical preview preroll."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "教主" }]
keywords = ["ffmpeg", "mp4", "edit-list", "video", "thumbnail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
hidden-preview-builder = "hidden_preview_builder.cli:main"

[project.gui-scripts]
hidden-preview-builder-gui = "hidden_preview_builder.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
